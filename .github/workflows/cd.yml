name: CD (auto-deploy main)

# Continuous delivery: when the CI workflow finishes successfully on main,
# build the images at that commit and open a promote PR against the infra repo.
# A broken main never reaches that PR, because this only runs on CI success —
# and merging the PR, not this workflow, is what deploys.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  auto-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      image_tag: ${{ github.event.workflow_run.head_sha }}
      git_ref: ${{ github.event.workflow_run.head_sha }}
