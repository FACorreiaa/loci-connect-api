name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.13.0 hangs. Its staticcheck loops on internal/domain/chat/handler
          # and internal/domain/chat/service and never returns: runs sat over an
          # hour and ignored cancellation, which made every PR look stuck on
          # lint. v2.13.2 and later lint the same tree in seconds.
          #
          # This line is the one place the version lives: .githooks/pre-commit
          # and `make lint` read it from here and `go run` that exact release,
          # so a different golangci-lint on PATH can't fail a commit CI passes.
          version: v2.15.0
          install-mode: goinstall
          only-new-issues: true
      - name: Go Vet
        run: go vet ./...
