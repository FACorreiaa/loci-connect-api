name: _deploy

# Reusable deploy pipeline: build + push the API and Postgres images to GHCR,
# then open a promote PR against the infra repo. ArgoCD rolls the release when
# that PR merges. Called by deploy.yml (release tags) and cd.yml (auto-deploy
# on green CI).
#
# There is no direct deploy here on purpose. Nothing in this repository can put
# a new image in front of users on its own — the promote PR is the gate, which
# is the same rule khepri and norviq run under.
on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker tag to publish/deploy"
        required: true
        type: string
      git_ref:
        description: "Git ref/sha to build (defaults to the calling ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      pg_image: ${{ steps.meta.outputs.pg_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Compute lowercase image names
        id: meta
        run: |
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api_image=${REGISTRY}/${owner_repo}" >> "$GITHUB_OUTPUT"
          echo "pg_image=${REGISTRY}/${owner_repo}-postgres" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.api_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Postgres image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./postgres.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.pg_image }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.pg_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # k3s/ArgoCD delivery. Opens a PR against the infra repo bumping both image
  # tags; merging it is what deploys. Self-gating: without INFRA_TOKEN it skips
  # rather than fails, so a fork or a repo without the secret still goes green.
  #
  # Replaces a compose-over-SSH deploy that never once succeeded between
  # 2026-08-15 and 2026-09-07 — every run failed on an unset VPS_SSH_KEY — and
  # whose target turned out to be the k3s node itself, so it would have run an
  # unmanaged container stack beside Kubernetes.
  promote:
    name: Open promote PR against the infra repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The gate is a run step rather than `if: secrets.INFRA_TOKEN != ''`.
      # The secrets context is not dependably available in a step-level `if`,
      # and a condition that silently evaluates false would skip delivery on
      # every push while the job still reported green.
      - name: Check delivery is configured
        id: gate
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          if [ -n "${INFRA_TOKEN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout LuminaVaultInfra
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: LuminaVault/LuminaVaultInfra
          token: ${{ secrets.INFRA_TOKEN }}
          ref: main

      - name: Open pull request
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          short="${TAG:0:7}"
          branch="promote/loci-${short}"

          values=apps/loci/api/values-production.yaml
          manifest=apps/loci/data/postgres.yaml

          # sed rather than yq: both files carry the reasoning for what they do
          # in comments and blank lines between blocks, and `yq -i` rewrites the
          # document — it keeps the comments but drops the blank lines, so every
          # promote PR would arrive with unrelated whitespace churn around the
          # one line that actually changed.
          sed -i -E "s|^( *tag: ).*|\1\"${TAG}\"|" "$values"
          # The API and Postgres images are built from the same commit and move
          # together. A Postgres older than the migrations about to run against
          # it is a broken deploy, not a version skew.
          sed -i -E "s|^( *image: ghcr\\.io/facorreiaa/loci-connect-api-postgres:).*|\1${TAG}|" "$manifest"

          if git diff --quiet; then
            echo "already at ${short}; nothing to promote"
            exit 0
          fi

          git config user.name "loci-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "$values" "$manifest"
          git commit -m "chore(loci): promote image to ${short}"
          git push origin "${branch}"

          cat > /tmp/pr-body.md <<EOF
          Promotes the Loci API and its Postgres to \`${TAG}\`.

          Built from ${{ github.repository }}@${{ github.sha }} by the deploy workflow.
          Merging this makes ArgoCD sync \`loci-api-production\` and \`loci-data\`
          in the \`horus\` namespace.
          EOF

          gh pr create \
            --repo LuminaVault/LuminaVaultInfra \
            --base main \
            --head "${branch}" \
            --title "chore(loci): promote image to ${short}" \
            --body-file /tmp/pr-body.md

      - name: Report when delivery is not configured
        if: steps.gate.outputs.configured == 'false'
        run: |
          echo "INFRA_TOKEN is not set, so no promote PR was opened."
          echo "The images are built and pushed; nothing will deploy until the"
          echo "secret exists. It needs contents:write and pull-requests:write"
          echo "on LuminaVault/LuminaVaultInfra."
