name: release-mcp

# Releases the loci-mcp stdio proxy binary. Uses an mcp-v* tag prefix so it
# is independent of the v*.*.* API deploy pipeline (deploy.yml).
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
